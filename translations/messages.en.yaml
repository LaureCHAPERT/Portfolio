about_page:
  title: About
  first_paragraph: "Full-stack developer, I spent over two years at Zei on an ESG management SaaS platform, after a first experience at QuickMS on the HR software Qrew."
  second_paragraph: "I enjoy work where front end and back end meet: design systems, tested and documented components, typed contracts between Symfony and TypeScript, access control. I work with shared architecture rules, systematic code review and close ties with design and product."
  third_paragraph: "Opquast certified, I make accessibility and web quality a habit. As a musician, I also pay particular attention to the visual craft of interfaces."
