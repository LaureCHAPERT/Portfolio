about_page:
  title: About
  first_paragraph: "Full-stack developer, I spent over two years at Zei on an ESG management SaaS platform, after a first experience at QuickMS on the HR software Qrew. My priority is the client's need: I start from there, not from a technology that would limit the solutions. I mostly work with PHP / Symfony, React / TypeScript and Python, and I adapt to what the project requires: technology is a means, not an end."
  second_paragraph: "Since my time at Zei, AI has been part of my daily work: LLM-based coding assistants such as Claude Code, connected to our tools through MCP servers, with reusable procedures and written project context (architecture, conventions, domain vocabulary). I use them to explore a codebase, run a first review pass, write assisted code, tests or documentation."
  third_paragraph: "Yet I stay mindful that our role remains essential: I read and understand every line before keeping it, sensitive actions are still validated by hand, and design, human review and team discussions remain at the heart of the job. AI saves me time on repetitive work so I can spend more of it thinking."
  fourth_paragraph: "Opquast certified, I make accessibility and web quality a habit."
  fifth_paragraph: "As a musician, I bring the same sensitivity and attention to detail to development: polishing a rendering, a user journey or an interaction until everything sounds right."
  remote_title: "I'm looking for a full-remote position"
  remote_text: "I live in the countryside and remote work is my everyday life: autonomy, clear written communication, asynchronous tools and regular check-ins with the team. Meeting my colleagues at off-sites or team days will always be a pleasure."
