about_page:
  title: À propos
  first_paragraph: "Développeuse full-stack, j'ai passé plus de deux ans chez Zei sur une plateforme SaaS de pilotage ESG, après une première expérience chez QuickMS sur le logiciel RH Qrew."
  second_paragraph: "J'aime les sujets où le front et le back se rencontrent : design system, composants testés et documentés, contrats typés entre Symfony et TypeScript, droits d'accès. Je travaille avec des règles d'architecture partagées, de la revue de code systématique et un lien étroit avec le design et le produit."
  third_paragraph: "Certifiée Opquast, je fais de l'accessibilité et de la qualité web une habitude. Musicienne, j'apporte aussi un soin particulier au rendu visuel des interfaces."
