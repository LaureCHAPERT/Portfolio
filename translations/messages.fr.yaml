about_page:
  title: À propos
  first_paragraph: "Développeuse full-stack, j'ai passé plus de deux ans chez Zei sur une plateforme SaaS de pilotage ESG, après une première expérience chez QuickMS sur le logiciel RH Qrew. Ma priorité, c'est le besoin client : je pars de là, et non d'une techno qui limiterait les solutions. Je travaille surtout avec PHP / Symfony, React / TypeScript et Python, et je m'adapte à ce que le projet demande : la techno est un moyen, pas une finalité."
  second_paragraph: "Depuis mon expérience chez Zei, l'IA fait partie de mon quotidien : assistants de code basés sur des LLM comme Claude Code, reliés à nos outils par des serveurs MCP, avec des procédures réutilisables et un contexte projet écrit (architecture, conventions, vocabulaire métier). Je m'en sers pour explorer une codebase, faire une première passe de relecture, écrire du code assisté, des tests ou de la documentation."
  third_paragraph: "Je reste pourtant vigilante sur notre rôle, qui demeure essentiel : je relis et je comprends chaque ligne avant de la garder, les actions sensibles restent validées à la main, et la conception, la revue humaine et les échanges avec l'équipe restent au cœur du métier. L'IA me fait gagner du temps sur le répétitif pour en garder davantage pour la réflexion."
  fourth_paragraph: "Certifiée Opquast, je fais de l'accessibilité et de la qualité web une habitude."
  fifth_paragraph: "Musicienne, je retrouve dans le développement la même sensibilité et le même sens du détail : soigner un rendu, un parcours ou une interaction jusqu'à ce que tout sonne juste."
  remote_title: "Je recherche un poste en full remote"
  remote_text: "J'habite à la campagne et le travail à distance est mon quotidien : autonomie, communication écrite claire, outils asynchrones et points réguliers avec l'équipe. Retrouver mes collègues lors de séminaires ou de journées d'équipe restera toujours un plaisir."
